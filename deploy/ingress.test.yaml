apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-fleet-manager-ingress-test
  namespace: k8s-fleet-manager
spec:
  ingressClassName: nginx
  rules:
    - host: test.diersmann.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-fleet-manager-app
                port:
                  number: 80
